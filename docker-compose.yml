# All Node tooling runs here because Windows Application Control on the dev PC
# blocks unsigned native binaries (research R13). docker/dev-entrypoint.sh relays
# localhost:54321/54322 to the host's local Supabase stack.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # Lets `npm run sb:*` manage the local Supabase stack from inside.
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env.local
        required: false

volumes:
  node_modules:
  next_cache:
